services:
  microcalc:
    build: .
    ports:
      - "8080:80"
    restart: unless-stopped
  dev:
    image: node:22-alpine
    profiles: [dev]
    working_dir: /app
    volumes:
      - .:/app
      - microcalc_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
volumes:
  microcalc_node_modules:
